# РЗН-ДОБОР ПО СПИСКУ ИНН (проверка таблицы типизации, заказчик 2026-09-15).
# Как rzn-local: реестр РЗН блокирует облачные датацентры, поэтому шаг
# выполняется self-hosted раннером с машины заказчика (легитимный доступ
# обычного пользователя, пауза 3 с/запрос). Список: data/rzn_extra_inns.txt
# (~310 ИНН ≈ 16-20 минут). Результат коммитится в data/osint.db.
name: rzn-extra

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-40        # общая группа: не пересекаться за osint.db
  cancel-in-progress: false

jobs:
  rzn:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости
        run: pip install httpx
      - name: Загрузка списка ИНН
        run: python -m src.rzn_extra load
      - name: Реестр лицензий РЗН (пауза 3 с)
        run: python -m src.rzn_extra run 5400
      - name: Сводка
        if: always()
        run: python -m src.rzn_extra report
      - name: Коммит результатов
        if: always()
        run: |
          git config user.name "chk-osint-local"
          git config user.email "local@users.noreply.github.com"
          git add data/osint.db
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "rzn-extra: лицензии по ИНН таблицы типизации $(date +%F)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
