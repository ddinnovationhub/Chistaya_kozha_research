# ПРЕДПОЛЁТНАЯ ПРОВЕРКА ключей и инструментов (заказчик, 2026-08-27).
# Одна кнопка, ~2 мин, стоимость ~0.52 ₽ (1 запрос Яндекс-поиска).
# Печатает таблицу: инструмент | работает/нет | деталь. Ключи не печатаются.
name: preflight

on:
  workflow_dispatch:

permissions:
  contents: write   # коммит счётчиков квот (сбой 128/403 в run 4)

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      YANDEX_GEOSEARCH_API_KEY: ${{ secrets.YANDEX_GEOSEARCH_API_KEY }}
      DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
      KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Предполётная проверка
        run: python -m src.preflight

      - name: Коммит счётчиков квот
        if: always()
        run: |
          git config user.name "chk-osint-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/osint.db
          if git diff --cached --quiet; then echo "Изменений нет"; else
            git commit -m "preflight: счётчики квот $(date +%F)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
