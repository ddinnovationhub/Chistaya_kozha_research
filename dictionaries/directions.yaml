# Пограничные правила, выведенные из 228 расхождений проверки заказчика.
# Применяются и кодом (src/direction_map.py), и агентом при суждениях.
boundary_rules:
  - id: R1-серология
    правило: >
      Классифицировать ПО СУТИ УСЛУГИ, не по болезни. Антитела IgG/IgM/IgA
      к возбудителям, ПЦР/ДНК/РНК возбудителей, посевы, микроскопия,
      гистология, ИГХ, цитология, онкомаркеры — Лаборатория, даже если
      возбудитель «кожный» (ВПЧ, гонококк, боррелия). 26 ошибок разметки
      были «антитела → Аллергология».
  - id: R2-аллергология
    правило: >
      Аллергология — это аллерген-специфика: IgE-панели, ImmunoCAP, Фадиатоп,
      аллергопробы, прик-тесты, АСИТ, приём аллерголога-иммунолога.
      Латинские коды аллергенов (t3, i71, m1, d1…) — маркер аллергопанели.
  - id: R3-генетика
    правило: >
      Генетика отделена от Лаборатории: мутации, генодиагностика, кариотип,
      полиморфизмы, НИПТ, ПГТ, фармакогенетика, панели наследственных рисков.
  - id: R4-ложные-ключи
    правило: >
      Ключ без контекста запрещён: «Берёза бородавчатая t3» — аллерген, не
      бородавка; «перхоть лошади» — аллерген, не трихология; «Барий в
      волосах» — лаборатория (волосы = биоматериал), не трихология;
      «анестезии» в хвосте «без учёта стоимости …» — не Анестезиология.
  - id: R5-брак
    правило: >
      UI-хвосты («Записаться», «Позвонить», «бонусов», «Акция…») отрезаются
      ДО классификации; если после отрезки услуга распознаётся — ставится
      направление услуги, а не Брак. Брак двух видов: «UI-текст» (кнопки,
      цены, расписания курсов) и «обрывок» (оборванный кусок названия).
  - id: R6-локализация-бьёт-метод
    правило: >
      Удаление новообразований влагалища/вульвы/шейки матки — Гинекология;
      уха — ЛОР/Хирургия; века — Офтальмология/пластика век. Радиоволновой
      метод (Сургитрон) сам по себе направление не задаёт.
  - id: R7-приёмы
    правило: >
      «Приём/консультация врача-X» идёт в направление специальности X
      (дерматовенеролог → Дерматовенерология и т.д.); специальности вне
      контура (кардиолог, гематолог, гастроэнтеролог, эндокринолог,
      педиатр, терапевт…) → Приём смежного специалиста. Выезд на дом
      НЕ меняет направление приёма. Пластический хирург, сосудистый
      хирург/флеболог → Хирургия (решение проверки заказчика).
  - id: R8-физио-vs-косметология
    правило: >
      Аппаратное воздействие на тело по мед. показанию (озон спины, СМТ,
      магнит, низкоинтенсивный лазер при заболеваниях) → Физиотерапия/массаж;
      то же на лицо/эстетика (омоложение, эпиляция) → Косметология.
      Мануальная терапия → Физиотерапия/массаж.
  - id: R9-эндоскопия
    правило: >
      Эндоскопические исследования и операции (ФГДС, колоноскопия,
      бронхоскопия, лапароскопические операции, включая гинекологические) →
      Хирургия/эндоскопия.

