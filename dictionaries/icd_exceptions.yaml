# Реестр исключений для теста диапазонов МКБ (системная правка заказчика 2026-08-25).
# Каждое исключение — явное, с обоснованием. Всё, чего здесь нет, обязано
# укладываться в один блок классификации МКБ-10 и не быть целой главой.

exceptions:
  - code: "A50-A64"
    used_in: [std_lab]
    justification: "полный официальный блок «Инфекции, передающиеся преимущественно половым путём» — целиком относится к дерматовенерологии; уже границы блока не сузить без потери нозологий"
  - code: "L63-L66"
    used_in: [trich_diagnostics, trich_treatment, mesotherapy_scalp]
    justification: "алопеции L63-L66 — трихологическое подмножество блока L60-L75 (болезни придатков кожи); диапазон УЖЕ блока, включён сюда для явности"
  - code: "L20-L30"
    used_in: [eczema_dermatitis_treatment]
    justification: "полный блок «Дерматит и экзема» — в отличие от B35-B49 (где системные микозы чужие), весь блок целиком дерматологический и соответствует тегу «Лечение экземы и дерматитов»; найдено ужесточённым правилом 2026-08-25, оставлено осознанно"
