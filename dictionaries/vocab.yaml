# Контролируемые словари всех аналитических колонок — этап 2
# ВЕРСИЯ: 0.1 · СТАТУС: НЕ УТВЕРЖДЁН ЗАКАЗЧИКОМ
# Свободный текст в аналитических колонках запрещён (ЖЁСТКИЕ ОГРАНИЧЕНИЯ).
# Валидатор словарей — src/validators.py (расширение на этапе 8).

meta:
  version: "0.1"
  date: "2026-08-24"
  status: "не утверждён заказчиком"

classification_type:      # колонка «Тип»
  - "Тип 1"
  - "Тип 1 (косметологический)"
  - "Тип 2"
  - "Тип 3"
  - "Не классифицировано"

grade:                    # колонка «Грейд»
  - "A"
  - "B"
  - "C"

gate_decision:            # лист 04_Кандидаты, колонка «Решение»
  - "Включён"
  - "Исключён"
  - "Требует проверки"
  - "Требует ручной проверки"
  - "Требует разрешения"   # entity resolution: имя совпало, адрес нет

exclusion_reason:         # колонка «Причина исключения» (при «Исключён»)
  - "салон красоты / нет медицинской деятельности"
  - "нет релевантного профиля"
  - "дубль"

field_status:             # разрешённые статусы вместо значения в ЛЮБОЙ колонке
  - "Не найдено"
  - "Уточнить"
  - "Требует ручной проверки"
  - "Сайт не найден на дату проверки"
  - "Раздел «Услуги» не найден"
  - "Юрлицо не идентифицировано"
  - "услуга не найдена на сайте на дату проверки"

service_presence:         # значение в колонках услуг (по тегам services.yaml)
  - "Есть"                # только при source_id с URL и цитатой
  - "услуга не найдена на сайте на дату проверки"
  - "Не найдено"          # грейд C: сайта нет

esthetic_markers_found:   # колонка «Эстетические маркеры» — список тегов cosm_est
  format: "перечень тегов из services.yaml через «; », либо статус из field_status"
  note: "решение заказчика 2026-08-24: состав маркеров вместо порога R2 — перерезка постфактум"

flag_single_nonadjacent:  # флаг «Тип 3 по единственному несмежному направлению»
  - "Да"
  - "Нет"

removal_method:           # колонка «Метод удаления» (по тегам neoplasm_removal_*)
  - "электрокоагуляция"
  - "криодеструкция"
  - "лазер"
  - "радиоволновой"
  - "хирургическое иссечение"
  - "метод не указан на сайте"
