# Справочник услуг — этап 1
# ВЕРСИЯ: 0.1-seed · СТАТУС: НЕ УТВЕРЖДЁН ЗАКАЗЧИКОМ · разведка по нему не ведётся
#
# Сид построен ТОЛЬКО из независимого источника №3 (номенклатура МЗ + МКБ-10).
# Источник №1 (язык предложения, обход сайтов — волны 1–2) и источник №2 (Вордстат,
# язык спроса) НЕ обработаны: нет API-ключей. Поля formulations_site и
# formulations_wordstat пусты у всех тегов — это честная неполнота, не завершённость.

meta:
  version: "0.1-seed"
  date: "2026-08-23"
  status: "не утверждён заказчиком; волны 1–2 и Вордстат не пройдены"
  sources:
    - source_id: SRC-804N-20260823
      name: "Приказ Минздрава России от 13.10.2017 N 804н «Об утверждении номенклатуры медицинских услуг» (с изм. от 12.07.2018)"
      url: "https://org.gnicpm.ru/wp-content/uploads/2019/01/Prikaz-Minzdrava-Rossii-ot-13.10.2017-N-804n-s-izm.-ot-12.0.pdf"
      official_publication: "http://publication.pravo.gov.ru/Document/View/0001201711080030"
      accessed: "2026-08-23"
      note: "PDF 547 стр., распарсено 10 380 услуг; профильная выборка 803 строки — scratchpad/804n_derm_subset.txt"
    - source_id: SRC-MKB10-20260823
      name: "МКБ-10, блоки классов XII (L), II (C43-C44, D10-D36), I (A50-A64, B00-B09, B35-B49, B85-B89), XVIII (R50-R69), IX (I70-I79)"
      url: "https://classinform.ru/mkb-10/l00-l99.html"
      accessed: "2026-08-23"
      note: "трёхзначные рубрики сверены по страницам блоков 2026-08-23 (L20,L23,L30,L40,L50,L57,L60,L63,L64,L65,L66,L68,L70,L71,L72,L80,L81,L82,L84,L90,L98,C43,C44,D17,D22,D23,B02,B07,B35,B86,R61 — совпали); четырёхзначные подрубрики (например B08.1, B35.1, B88.0, A63.0, I78.1, L57.0) на страницах блоков отсутствуют → статус «Уточнить», сверка на этапе 9"

# contour — дерматологический маршрут для классификатора G4 (этап 2):
#   derm        — медицинская дерматология (Тип 1)
#   oncoderm    — онкодерматология (Тип 1)
#   trich       — трихология (Тип 1)
#   dermsurg    — дерматохирургия (Тип 1)
#   cosm_est    — эстетическая косметология (маркер Типа 2 при сочетании с derm)
#   cosm_med    — медицинская (врачебная) косметология — граница решается на этапе 2

tags:
  # ── Приёмы и диагностика ────────────────────────────────────────────────
  - tag: derm_consult
    name_ru: "Приём дерматолога / дерматовенеролога"
    contour: derm
    icd10: ["L00-L99", "A63.0", "B07", "B35-B49"]
    nomenclature:
      - {code: "B01.008.001", name: "Прием (осмотр, консультация) врача-дерматовенеролога первичный", source_id: SRC-804N-20260823}
      - {code: "B01.008.002", name: "Прием (осмотр, консультация) врача-дерматовенеролога повторный", source_id: SRC-804N-20260823}
    formulations_site: []        # волна 1 — заблокировано: нет ключей
    formulations_wordstat: []    # заблокировано: нет доступа к Вордстату

  - tag: cosm_consult
    name_ru: "Приём врача-косметолога"
