# Классификатор Тип 1/2/3 — этап 2
# ВЕРСИЯ: 1.0 · СТАТУС: УТВЕРЖДЁН ЗАКАЗЧИКОМ 2026-08-24 (полностью, включая cosm_med)
#
# Правила применяются МЕХАНИЧЕСКИ к меткам contour тегов из services.yaml,
# найденных у клиники (Facility) на её официальном сайте.
# Единица классификации — Facility (филиал), НЕ бренд: перенос типа между
# филиалами одного бренда запрещён (решение Инженера entity resolution).
# Тип присваивается ТОЛЬКО после просмотра разделов Услуги / Направления /
# Врачи / Прайс. Присвоение по названию бренда — запрещено (ЖЁСТКИЕ ОГРАНИЧЕНИЯ).

meta:
  version: "1.0"
  date: "2026-08-24"
  status: "УТВЕРЖДЁН ЗАКАЗЧИКОМ 2026-08-24 полностью: R2 без порога, флеболог в несмежных, cosm_med не считается медицинской дерматологией (проверено по модели клиента: у «Чистой Кожи» врача-косметолога нет), выходные поля и флаги"
  unit: "Facility (филиал)"
  calibration: "списки keywords составлены до волны 1 и НЕ калиброваны по реальным сайтам; после волны 1 обязательная сверка ложных срабатываний (такт 3, Верификатор)"

# ── Группы контуров (ссылки на поле contour в services.yaml) ──────────────
contour_groups:
  medical_derm:            # «медицинская дерматология» для правила Тип 2
    - derm
    - oncoderm
    - trich
    - dermsurg
  esthetic:
    - cosm_est
  medical_cosmetology:     # врачебная косметология — ОТДЕЛЬНАЯ группа
    - cosm_med
  # УТВЕРЖДЕНО ЗАКАЗЧИКОМ 2026-08-24: cosm_med НЕ входит в medical_derm.
  # Проверено по модели клиента: у «Чистой Кожи» врача-косметолога нет,
  # раздела косметологии на сайте нет. Клиника «эстетика + косметолог» без
  # дерматологического контура → «Тип 1 (косметологический)», не Тип 2.

# ── Маркеры несмежных направлений (→ Тип 3) ──────────────────────────────
# Найденный на сайте раздел/приём по любому из направлений = несмежное.
# Ключевые слова — для обнаружения в тексте сайта; решение принимается по
# разделу «Услуги/Направления/Врачи», а не по случайному упоминанию слова.
nonadjacent_directions:
  - {name: "гинекология",     keywords: ["гинеколог", "гинекология", "акушер"]}
  - {name: "терапия",         keywords: ["врач-терапевт", "приём терапевта", "терапевтическое отделение"]}
  - {name: "педиатрия",       keywords: ["педиатр", "детский врач общей практики"]}
  - {name: "урология",        keywords: ["уролог", "урология", "андролог"]}
  - {name: "кардиология",     keywords: ["кардиолог", "кардиология", "ЭКГ"]}
  - {name: "неврология",      keywords: ["невролог", "неврология", "невропатолог"]}
  - {name: "ЛОР",             keywords: ["отоларинголог", "оториноларинголог", "лор-врач", "лор врач"]}
  - {name: "офтальмология",   keywords: ["офтальмолог", "окулист", "офтальмология"]}
  - {name: "стоматология",    keywords: ["стоматолог", "стоматология", "зубной"]}
  - {name: "хирургия вне дерматохирургии", keywords: ["общая хирургия", "абдоминальная хирургия", "флеболог", "проктолог", "нейрохирург"],
     note: "флеболог остаётся несмежным — УТВЕРЖДЕНО ЗАКАЗЧИКОМ 2026-08-24: у клиента флеболога нет; лазерная коагуляция сосудов у клиента — дерматологическая сосудистая патология (купероз, звёздочки на лице), не варикоз; разные специальности, разный пациент. Тип 3 по единственному направлению помечается флагом flag_single_nonadjacent"}
  - {name: "МРТ/КТ при широкой поликлинике", keywords: ["МРТ", "КТ", "магнитно-резонансная томография"],
     decisive: false,
     note: "ИНФОРМАЦИОННЫЙ маркер (такт 3, Методолог): срабатывает только при ≥2 других несмежных — но тогда R1 уже сработал по ним; на решение не влияет, пишется в доказательства"}
  - {name: "эндокринология",  keywords: ["эндокринолог", "эндокринология"],
     note: "добавлено на такте 3 (Дерматовенеролог): частый профиль многопрофильных клиник"}
  - {name: "психиатрия/психотерапия", keywords: ["психиатр", "психотерапевт", "нарколог"],
     note: "добавлено на такте 3 (Дерматовенеролог)"}

# Слова, НЕ являющиеся маркерами несмежности (ложные срабатывания):
nonadjacent_exclusions:
  - "онколог"          # онкодерматология — наш контур (oncoderm)
  - "дерматохирургия"  # наш контур (dermsurg)
  - "анализы"          # лаборатория обслуживает дерматологию
  - "УЗИ кожи"         # инструментальная диагностика нашего контура

# ── Правила (применять по порядку, первое сработавшее — финальное) ────────
rules:
  - id: R1_type3
    if: "найдено ≥1 несмежное направление из nonadjacent_directions"
    then: "Тип 3"
  - id: R2_type2
    if: "несмежных нет И есть contour из esthetic И есть contour из medical_derm"
    then: "Тип 2"
  - id: R3_type1_derm
    if: "несмежных нет И есть contour только из medical_derm (± medical_cosmetology)"
    then: "Тип 1"
  - id: R4_type1_cosm
    if: "несмежных нет И есть contour только из esthetic (± medical_cosmetology)"
    then: "Тип 1 (косметологический)"
  - id: R4a_type1_cosm_med_only
    if: "несмежных нет И есть contour только из medical_cosmetology"
    then: "Тип 1 (косметологический)"
    note: "добавлено на такте 3 (Методолог): случай «только приём врача-косметолога» не покрывался R1–R4 — дыра полноты"
  - id: R5_unclassified
    if: "разделы Услуги/Направления/Врачи/Прайс не просмотрены ИЛИ ни один тег не найден"
    then: "Не классифицировано"

# R2 без порога — УТВЕРЖДЕНО ЗАКАЗЧИКОМ 2026-08-24.
# Обоснование (решение заказчика): точка отсчёта — модель клиента «Чистая Кожа»,
# у которой НОЛЬ эстетических маркеров (в блоке «не делает»: лазерная и аппаратная
# эпиляция, фотоомоложение, фракционные шлифовки, ботулинотерапия, контурная
# пластика, биоревитализация, мезотерапия лица и тела, чистки, пилинги,
# профессиональные уходы; раздела косметологии на сайте нет — файлы проекта
# osint-context-chistaya-kozha.txt, chistaya_kozha_market_sizing_context.md).
# Один эстетический маркер = структурное отличие от модели клиента (есть
# косметологический денежный поток, которого у клиента нет). R2 ловит ровно это.
#
# ВМЕСТО ПОРОГА — состав маркеров сохраняется полем esthetic_markers_found
# (см. output_fields): данные можно перерезать по любому порогу постфактум
# без повторного прогона.
#
# Валидный исход пилота (зафиксировано решением заказчика 2026-08-24):
# если Тип 1 окажется почти пустым — это НЕ ошибка правила, а находка
# «модель клиента близка к уникальной». Классификатор по этому поводу не правится.

# ── Выходные поля классификации (пишутся для КАЖДОЙ клиники) ──────────────
output_fields:
  - name: esthetic_markers_found
    type: "список тегов contour=cosm_est, найденных на сайте"
    purpose: "перерезка данных по любому порогу постфактум без повторного прогона (решение заказчика 2026-08-24)"
  - name: nonadjacent_found
    type: "список несмежных направлений, найденных на сайте"
    purpose: "прозрачность основания Типа 3"
  - name: flag_single_nonadjacent
    type: "булев флаг «Тип 3 по единственному несмежному направлению»"
    purpose: "решение заказчика 2026-08-24 (контекст обсуждения флеболога): Тип 3 на одном направлении виден отдельно и проверяем вручную"
  - name: flag_removal_outside_derm
    type: "булев флаг «удаление новообразований вне дерматологического контура»"
    rule: "есть ≥1 тег contour=dermsurg (neoplasm_removal*) И НЕТ ни одного диагностического/приёмного тега дерматологии (derm_consult, onco_consult, dermatoscopy, histology_skin, skin_biopsy, std_consult_lab)"
    purpose: "решение заказчика 2026-08-24: такая клиника — одновременно конкурент по конкретной услуге и аргумент позиционирования клиента (удаление без гистологии). Терять эти случаи нельзя"
    note: "флаг НЕ зависит от присвоенного типа: по механике правил dermsurg входит в medical_derm, поэтому «эстетика + удаление без дерматолога» получает Тип 2 по R2 — флаг выделяет её из общей массы Типа 2"

# ── Атрибуция услуг филиалу (такт 3, Инженер entity resolution) ───────────
attribution:
  - "тип присваивается ПОСЛЕ ворот G0 (дедупликация) и разрешения дублей"
  - "если сайт бренда не разделяет услуги по филиалам: каждый филиал наследует
     тип сайта с пометкой «сайт общебрендовый, услуги по филиалу не разделены»
     и грейдом не выше B"
  - "если сайт разделяет филиалы (страницы адресов с услугами) — классифицировать
     каждый филиал по его странице"

# ── Грейды доказательности ────────────────────────────────────────────────
grades:
  A: "все четыре раздела просмотрены (Услуги, Направления, Врачи, Прайс)"
  B: "разделы просмотрены частично — обязательна пометка, какой раздел не проверен"
  C: "официальный сайт не найден — все поля услуг «Не найдено»"

# ── Запреты (дублируют ЖЁСТКИЕ ОГРАНИЧЕНИЯ, обязательны к проверке) ───────
prohibitions:
  - "тип по названию бренда — запрещено"
  - "перенос типа между филиалами/городами/брендами — запрещён"
  - "«нет страницы услуги» = «нет услуги» — запрещено; статус: «услуга не найдена на сайте на дату проверки»"
  - "тип с агрегатора (2ГИС, ПроДокторов) — запрещён, только официальный сайт"
  - "слияние тегов, меняющее тип клиники, — стоп, подтверждение заказчика (G4.1)"
