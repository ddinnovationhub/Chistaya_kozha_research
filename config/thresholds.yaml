# Пороги обязательной остановки (из CLAUDE.md + решения заказчика 2026-08-24)
budget_rub: 5000
budget_warn_share: 0.8          # предупреждение при 80% расхода
source_error_rate_stop: 0.20    # источник отдаёт ошибки >20% запросов → стоп
grade_c_share_stop: 0.30        # доля строк грейда C >30% по городу → стоп
row_not_found_share_manual: 0.5 # строка с >50% полей «Не найдено» → «Требует ручной проверки»

# Стоимость запросов (решение заказчика 2026-08-24: в Yandex Cloud НЕТ жёсткого
# лимита затрат — бюджет только уведомляет; программный счётчик в src/budget.py —
# ЕДИНСТВЕННАЯ реальная защита от перерасхода).
# Значения правятся здесь, без изменения кода. ОЦЕНКИ — уточнить по фактическому
# счёту Yandex Cloud после первых прогонов и поправить.
cost_per_request_rub:
  # 0.52 — ФАКТИЧЕСКАЯ цена из биллинга (заказчик, 2026-08-26, п.5):
  # пилот Новосибирска — 31 запрос = 16 ₽ (остаток гранта 3984 ₽ из 4000 ₽).
  yandex_search_api: 0.52
  dadata: 0.0               # suggest в пределах бесплатного тарифа; сверить лимит

# Anthropic API НЕ используется (решение заказчика 2026-08-26, п.6, отменяет
# решение 2026-08-26 об этапе 6 через модель): расход 90-180 $ на проект
# неприемлем. Этап 6 — ступень 1 кодом + ручная разметка батчей в Claude Code.

# Каскад доступа к сайтам (заказчик, 2026-08-26): 4 уровня по возрастанию
# стоимости; страница 200 без признаков контента = не взята (suspicious_zero).
cascade:
  content_min_bytes: 3000       # порог объёма «признак контента» (данные решат после прогона)
  unreachable_share_stop: 0.15  # недоступных >15% → остановка и доклад: проблема системная
  max_pages_per_domain: 40      # адаптивный обход (заказчик 2026-08-26, п.5): все
                                # прайс/каталог-страницы + второй уровень раздела услуг
  # Таймауты (разбор зависания 2026-08-26): превышение прерывает и логирует.
  # Норма по данным: клиника 6с–8мин (медиана 3.5 мин), страница ≤3.5 мин
  page_budget_sec: 240          # вся страница через все уровни каскада
  clinic_budget_sec: 600        # весь обход одной клиники
  stage6_budget_min: 150        # потолок этапа 6 целиком; чекпойнт сохраняется

# G2-МЕРА, УЖЕСТОЧЕНА (заказчик, 2026-08-25): прежние пороги
# (≥2 позиций и доля ≥10%, либо ≥5 позиций) мягкие — 10% пропускает
# пластическую хирургию с тремя дерм-позициями из тридцати, «≥5 без доли»
# пропускает крупный многопрофильный центр. Новое правило:
#   доля профильных позиций ≥ share_min (30%),
#   ЛИБО позиций ≥ big_rows_min (15) при доле ≥ big_share_min (15%) —
#        крупная клиника, где дерматология полноценное направление,
#        но теряется в процентах на фоне широкого прайса,
#   ЛИБО в прайсе есть ПРИЁМ ПРОФИЛЬНОГО ВРАЧА (дерматолог/дерматовенеролог/
#        онкодерматолог/трихолог/дерматохирург) — приём весит больше
#        процедуры, такая клиника конкурент даже при малом числе процедур.
# Эстетический контур: эстетических единиц ≥ esth_units_min (Тип 1
# косметологический — рынок по классификатору; решение по alab54 2026-08-26).
# Профильная позиция для счётчика = словарный дерм-тег ИЛИ якорная лексика
# в названии; якорь занижает (гистология без слова «кожа») — оговорено,
# компенсируется ветвью приёма профильного врача.
gate2:
  share_min: 0.30
  big_rows_min: 15
  big_share_min: 0.15
  esth_units_min: 2

# Гейт «доля профильных строк ≥70%» ОТМЕНЁН (заказчик, 2026-08-25): метрика
# измеряла тавтологию — её обеспечивал сам фильтр. Новая метрика выгрузки —
# ПОЛНОТА СБОРА (лист «Полнота_сбора» в промежуточной выгрузке).

# Маппинг ступени 1 (решения заказчика 2026-08-26 по мерам 1-3)
mapping:
  # 0.92 — НЕ ОПУСКАТЬ: «удаление ДОБРОкачественных новообразований» против
  # «иссечение ЗЛОкачественных» даёт схожесть 0.84 — порог ниже путает
  # клинически противоположные услуги (доказано на данных пачки 2026-08-26)
  fuzzy_threshold: 0.92

# Критерий насыщения разведки (уточнён заказчиком 2026-08-24):
# окно = max(50, 25% списка запросов); срабатывание не раньше 60% списка;
# при списке < 200 запросов критерий НЕ применяется (доходим до конца списка)
saturation:
  min_list_len: 200
  window_min: 50
  window_share: 0.25
  earliest_trigger_share: 0.60
  new_candidates_threshold: 3   # <3 новых уникальных кандидатов в окне → стоп
