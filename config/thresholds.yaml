# Пороги обязательной остановки (из CLAUDE.md, раздел «Обязательная остановка»)
# СТАТУС: перенесено из ТЗ дословно, заказчиком отдельно не утверждено
budget_rub: 5000
budget_warn_share: 0.8          # предупреждение при 80% расхода
source_error_rate_stop: 0.20    # источник отдаёт ошибки >20% запросов → стоп
grade_c_share_stop: 0.30        # доля строк грейда C >30% по городу → стоп
saturation_window: 50           # последние 50 запросов…
saturation_new_candidates: 3    # …дали <3 новых уникальных кандидатов → стоп разведки
row_not_found_share_manual: 0.5 # строка с >50% полей «Не найдено» → «Требует ручной проверки»
