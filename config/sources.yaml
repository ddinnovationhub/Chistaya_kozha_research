# Реестр источников и правовой режим — этап 3
# ВЕРСИЯ: 1.0 · СТАТУС: УТВЕРЖДЁН ЗАКАЗЧИКОМ 2026-08-24
#
# Для каждого источника: роль, слои запросов, лимиты, поведение при отказе,
# правовой режим (что разрешено сохранять). Составлено тактами 1–4
# (Юрист OSINT, Разведчик источников).

meta:
  version: "1.0"
  date: "2026-08-24"
  status: "УТВЕРЖДЁН ЗАКАЗЧИКОМ 2026-08-24"

# ── Правовые ограничения, зафиксированные раз и навсегда ──────────────────
# Источник истины — CLAUDE.md, раздел «Этап 3»; здесь копия для machine-read.
# При расхождении CLAUDE.md главнее (такт 3, Методолог).
legal_fixed:
  yandex_org_search_api: "данные API поиска по организациям Яндекса НЕ сохраняются — лицензия запрещает; только обнаружение URL, подтверждение с официального сайта"
  personal_data_152fz: "персональные данные врачей не собираются; ФИО в таблице нет; только количество специалистов, если указано явно на сайте"
  crawl_rate: "частота обращений к одному домену ограничена (domain_request_delay_sec в run.yaml); агрессивный краулинг запрещён"
  robots_txt: "robots.txt каждого домена проверяется до обхода; запрещённые пути не обходятся; User-Agent не маскируется под поисковый бот"

# ── Роли источников ───────────────────────────────────────────────────────
# discovery      — обнаружение кандидатов (URL, название, адрес)
# verification   — подтверждение фактов (услуги, лицензии, тип)
# requisites     — реквизиты юрлица (ИНН/ОГРН)
# demand         — язык спроса (частотность)

sources:
  - id: yandex_search_api
    name: "Яндекс Search API (web)"
    url: "https://searchapi.api.cloud.yandex.net/v2/web/search"
    role: [discovery]
    layers: [L2, L3, L4, L5, L6, L7]
    auth: "YANDEX_API_KEY + YANDEX_FOLDER_ID (окружение)"
    rate_limit: "≤1 RPS (запас); договорный лимит Уточнить при первом живом вызове (такт 3, Верификатор: цифра не сверена)"
    budget: "платный — учитывается в BUDGET_RUB (5000 ₽, checkpoint при 80%)"
    on_failure: "handle_api_response: 402/429 → стоп+чекпойнт; 401/403 → стоп; 503/504 → пауза 30 с, повтор"
    allowed_to_store: "журнал запросов (query_id, текст, дата, число результатов) + URL и заголовки результатов как discovery-лог"
    forbidden_to_store: "тексты сниппетов долговременно; выдача целиком"
    legal_note: "условия Yandex Cloud Search API; результаты — указатели на сайты, факты подтверждаются на официальном сайте"

  - id: yandex_maps
    name: "Яндекс Карты (рубрики организаций)"
    url: "https://yandex.ru/maps/"
    role: [discovery]
    layers: [L1]
    rate_limit: "ручной темп, ≤1 запрос/3 с"
    on_failure: "капча/блок → стоп по источнику, отметка в журнале, доклад при >20% отказов"
    allowed_to_store: "ТОЛЬКО: факт существования карточки + название + URL официального сайта из карточки"
    forbidden_to_store: "содержимое карточек (описания, отзывы, рейтинги, телефоны) — legal_fixed.yandex_org_search_api"
    legal_note: "жёсткий режим из CLAUDE.md: discovery-only"

  - id: gis2
    name: "2ГИС (рубрики организаций)"
    url: "https://2gis.ru/"
    role: [discovery]
    layers: [L1]
    rate_limit: "≤1 запрос/3 с; браузерный User-Agent честный (не бот-маскировка)"
    on_failure: "антибот → снизить темп; повторный блок → стоп по источнику, доклад"
    allowed_to_store: "факт существования карточки + название + адрес (для дедупликации G0) + URL сайта"
    forbidden_to_store: "описания, отзывы, рейтинги, фото; конвертация числа карточек в число клиник (ЗАПРЕЩЕНО ТЗ)"
    legal_note: "ToS 2ГИС запрещает массовое копирование БД; используем как справочник существования, не как источник фактов"

  - id: prodoctorov
    name: "ПроДокторов"
    url: "https://prodoctorov.ru/"
    role: [discovery]
    layers: [L1, L5]
    rate_limit: "≤1 запрос/3 с"
    on_failure: "антибот → снизить темп; блок → стоп по источнику, доклад"
    allowed_to_store: "факт существования карточки клиники + название + URL сайта"
    forbidden_to_store: "профили врачей (152-ФЗ: персональные данные), отзывы, рейтинги"
    legal_note: "карточки врачей не открываются вовсе — там персональные данные"

  - id: napopravku
    name: "НаПоправку"
    url: "https://napopravku.ru/"
    role: [discovery]
    layers: [L1, L5]
    rate_limit: "≤1 запрос/3 с"
    on_failure: "как prodoctorov"
    allowed_to_store: "факт существования карточки + название + URL сайта"
    forbidden_to_store: "профили врачей, отзывы, рейтинги"

  - id: zoon
    name: "Zoon"
    url: "https://zoon.ru/"
    role: [discovery]
    layers: [L1, L5]
    rate_limit: "≤1 запрос/3 с"
    on_failure: "как prodoctorov"
    allowed_to_store: "факт существования карточки + название + URL сайта"
    forbidden_to_store: "описания, отзывы, рейтинги"

  - id: roszdravnadzor
    name: "Реестр лицензий Росздравнадзора"
    url: "https://roszdravnadzor.gov.ru/services/licenses"
    role: [verification, requisites]
    layers: [L5]
    rate_limit: "≤1 запрос/5 с (гос. ресурс, щадящий режим)"
    on_failure: "503/недоступность → пауза 60 с, 3 попытки; далее отметка «реестр недоступен на дату», НЕ вывод об отсутствии лицензии"
    allowed_to_store: "записи реестра целиком: лицензия, юрлицо, ИНН, адреса мест деятельности, виды работ (открытые данные)"
    forbidden_to_store: "—"
    legal_note: "официальные открытые данные; слово «все клиники» допустимо ТОЛЬКО после сплошного перебора этого реестра (ТЗ)"
    open_item: "способ сплошного перебора (выгрузка по региону / постраничный обход формы) определить на пилоте — форма поиска может не отдавать полный список (такт 3, Верификатор)"

  - id: dadata
    name: "DaData (suggest/party)"
    url: "https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/party"
    role: [requisites]
    layers: []
    auth: "DADATA_API_KEY (+ DADATA_SECRET_KEY для стандартизации)"
    rate_limit: "≤5 RPS; суточный лимит тарифа Уточнить на dadata.ru/profile/ при первом живом вызове (такт 3, Верификатор)"
    budget: "в пределах бесплатного тарифа; превышение → 402 → стоп+чекпойнт"
    on_failure: "handle_api_response"
    allowed_to_store: "реквизиты юрлиц из ЕГРЮЛ (ИНН, ОГРН, адрес, статус) — открытые данные"
    forbidden_to_store: "ФИО руководителя не хранится нигде, включая osint.db — принцип минимизации 152-ФЗ (такт 3, Юрист OSINT); сверка юрлица идёт по ИНН/ОГРН/адресу"
    legal_note: "правила G5: запись ИНН только при совпадении 2 из 3 (название, адрес, телефон); валидация формата обязательна"

  - id: rusprofile_checko
    name: "Rusprofile / Checko"
    url: "https://www.rusprofile.ru/ · https://checko.ru/"
    role: [requisites]
    layers: []
    rate_limit: "единичные ручные запросы, ≤1/5 с"
    on_failure: "блок → отказ от источника, статус «Уточнить»"
    allowed_to_store: "ИНН/ОГРН только при однозначном совпадении (приоритет 3 в G5)"
    forbidden_to_store: "массовая выгрузка запрещена их ToS"
    legal_note: "использовать только когда сайт клиники и DaData не дали результата"

  - id: official_sites
    name: "Официальные сайты клиник"
    url: "—"
    role: [verification, requisites]
    layers: [L2, L5]
    rate_limit: "≤1 запрос/3 с на домен; повторное открытие того же сайта запрещено архитектурой (producer/consumer)"
    fetch_chain: "Jina Reader (https://r.jina.ai/{url}) → при SPA: Playwright headless"
    on_failure: "сайт недоступен → 2 повтора с паузой; далее статус «Сайт не найден на дату проверки», грейд C"
    allowed_to_store: "страницы целиком в raw/{city}/{date}/ (gzip) как доказательная база; цитаты с URL в 03_Доказательства"
    forbidden_to_store: "персональные данные врачей (ФИО не переносятся в таблицу; количество специалистов — только если указано явно)"
    legal_note: "публичная оферта сайтов; robots.txt чтится; это ЕДИНСТВЕННЫЙ источник подтверждения услуг и типа"

  - id: jina_reader
    name: "Jina Reader (прокси-читалка)"
    url: "https://r.jina.ai/"
    role: [verification]
    layers: []
    rate_limit: "консервативно ≤10 RPM; фактический лимит Уточнить по поведению (такт 3, Верификатор)"
    on_failure: "429/5xx → пауза, повтор; стабильный отказ → прямой fetch + Playwright"
    allowed_to_store: "результат конвертации страницы (тот же правовой режим, что official_sites)"
    legal_note: "технический посредник, не источник фактов"

  - id: wordstat_manual
    name: "Вордстат (ручные выгрузки заказчика)"
    url: "data/wordstat/{тег}.csv"
    role: [demand]
    layers: [L3]
    rate_limit: "—"
    on_failure: "файла нет → слой L3 работает на сиде из nosology.yaml, отметка в отчёте"
    allowed_to_store: "CSV целиком (выгрузка сделана человеком в своём аккаунте)"
    legal_note: "решение заказчика 2026-08-24: API Директа не используется; агент читает только из data/wordstat/"

  - id: city_districts
    name: "Административные районы городов (для слоя L6)"
    url: "официальные сайты администраций городов / ОК АТО-ОКТМО"
    role: [discovery]
    layers: [L6]
    rate_limit: "единичные запросы"
    on_failure: "район не подтверждён официальным источником → в data/city_districts.json не пишется"
    allowed_to_store: "перечни районов в data/city_districts.json с source_id на страницу администрации"
    legal_note: "открытые данные; добавлен на такте 3 (Разведчик): L6 не имел зарегистрированного источника"

  - id: project_files
    name: "Файлы проекта заказчика (ручной сбор, 4 города)"
    url: "ЧК_ОСИНТ_ОБРАЗЕЦ.xlsx (ожидается загрузка), osint-context-chistaya-kozha.txt, chistaya_kozha_market_sizing_context.md"
    role: [discovery, verification]
    layers: []
    rate_limit: "—"
    on_failure: "файл отсутствует в репо → запросить у заказчика, не реконструировать по памяти"
    allowed_to_store: "формулировки услуг (волна 0), список известных клиник для recall-теста"
    legal_note: "собственные материалы заказчика; source_id: «ручной сбор проекта, 4 города, 2026»; добавлен на такте 3 (Разведчик): recall-тест не имел зарегистрированного источника"

  - id: perplexity
    name: "Perplexity API (резервный контур)"
    url: "https://api.perplexity.ai/"
    role: [discovery]
    layers: [L7]
    auth: "PERPLEXITY_API_KEY (необязательный)"
    status: "ключа нет — контур отключён, зафиксировано"
    on_failure: "handle_api_response"
    allowed_to_store: "только как наводка для L7; каждый факт перепроверяется первоисточником"
    legal_note: "ответы модели НЕ являются источником — только указателем"
